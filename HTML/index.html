<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <label for="fn">First name:</label>
        <input type="text" name="First_name" id="fn" required>
        <br>
        <label for="ln">Last name:</label>
        <input type="text" name="Last_name" id="ln" required>
        <br>
        <label for="em">Email:</label>
        <input type="email" name="Email" id="em" required>
        <br>
        <label for="mn">Mobile No.:</label>
        <input type="tel" name="Mobile_no" id="mn" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" required>
        <br>
        <label for="pass">Password:</label>
        <input type="password" name="password" id="pass" required>
        <br>
        <label for="add">Address:</label>
        <textarea type="text" name="add" id="add" required></textarea>
        <br>
        <button type="reset">Reset</button>
        <button type="submit">submit</button>
    </form>
</body>
</html>
